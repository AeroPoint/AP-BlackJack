[build-system]
requires      = ["maturin>=1.6,<2.0"]
build-backend = "maturin"

[project]
name            = "blackjack-core"
requires-python = ">=3.11"
description     = "Native accelerator for the blackjack solver."
classifiers     = ["Private :: Do Not Upload"]
dynamic         = ["version"]

[tool.maturin]
features      = ["pyo3/extension-module"]
module-name   = "blackjack_core"
