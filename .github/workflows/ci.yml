name: CI

on:
  push:
    branches: [main, master]
  pull_request:

# Supersede an in-flight run only on a branch, never on main. Cancelling
# redundant pull-request runs is the point of this block -- a force-push should
# not leave the old commit's jobs burning minutes. But main is the branch whose
# green badge is load-bearing, and two merges landing close together used to
# cancel each other: the run for the superseded commit died, the run for the new
# one died to the merge after it, and the last *successful* run on main was from
# before either. A cancelled run is not a failing run, so nothing shouts -- the
# head just silently has no verdict. Pushes to main now queue instead.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # The engine has no dependencies, so this job proves it: a bare Python with
  # nothing installed must run the CLI and import every module. If this breaks,
  # ADR-0004 has been violated somewhere.
  bare-python:
    name: bare python (no dependencies)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Run the solver with nothing installed
        run: |
          PYTHONPATH=src python -m blackjack.cli solve --rules vegas6-h17
          PYTHONPATH=src python -m blackjack.cli explain T6 T
      - name: Check declared licences
        run: python scripts/check_licenses.py --declared

  test:
    name: test (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - run: uv python install ${{ matrix.python }}
      - run: uv sync --extra cli --extra api
      - name: Lint
        run: uv run ruff check .
      - name: Format check
        run: uv run ruff format --check .
      - name: Types
        run: uv run mypy
      - name: Fast tests
        run: uv run pytest -m "not slow" -q
      - name: Installed licences
        run: uv run python scripts/check_licenses.py

  # Cross-validation between the solver and the simulator needs millions of
  # rounds, so it runs once rather than across the matrix.
  cross-validation:
    name: solver vs simulator
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - run: uv python install 3.13
      - run: uv sync
      - run: uv run pytest -m slow -q

  # Builds the accelerator and proves it agrees with the Python reference. The
  # parity suite skips itself when no core is present, so without this job it
  # would go green having tested nothing -- which is why the build and the
  # parity run belong in the same job.
  native:
    name: native core + parity
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - run: uv python install 3.13
      - name: Format
        run: cargo fmt --manifest-path crates/blackjack-core/Cargo.toml --check
      - name: Clippy
        run: cargo clippy --manifest-path crates/blackjack-core/Cargo.toml --release -- -D warnings
      - name: Build and install the accelerator
        run: |
          uv sync --extra cli
          uv run maturin develop --release --manifest-path crates/blackjack-core/Cargo.toml
      - name: Confirm the core is actually loaded
        run: uv run python -c "from blackjack.backend import ACTIVE; assert ACTIVE.is_native, ACTIVE.reason; print(ACTIVE.reason)"
      - name: Parity against the Python reference
        run: uv run pytest -m parity -q
      - name: Full fast suite on the native backend
        run: uv run pytest -m "not slow" -q
